name: Potentiometer controls LED brightness
version: 1
author: Pavlo
steps:
  - wait-serial: 'Ready'
  - set-control:
      part-id: pot1
      control: position
      value: 1
  - wait-serial: 'duty=255,'
  - set-control:
      part-id: pot1
      control: position
      value: 0
  - wait-serial: 'duty=0,'
